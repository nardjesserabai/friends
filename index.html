<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>friends app</title>
        <link rel="stylesheet" href="style.css">
         <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
        href="https://fonts.googleapis.com/css2?family=Aldrich&family=Pixelify+Sans:wght@400..700&display=swap"
        rel="stylesheet"
        />
        <title>Check out</title>
    </head>
    <body>
        <!-- the envlope screen  -->
        <div class="envlope">
            <img src="assets/envelope.png" class="envlope-icon" alt="heart-gif">
            <p class="message">GOT YOU !</p>
        </div>
        <!-- the window sceen  -->
        <div class="letter-container">

            <div  class="letter-window" >

                <h1 class="message">Will you be my friend forever ?</h1>
                <img class="cat" src="assets/cat_heart.gif">
                <div class="buttons">
                    <img class="button yes-btn" src="assets/yes.png" alt="yes">
                    <div class="no-wrapper">
                        <img class="button no-btn" src="assets/no.png" alt="no">
                    </div>

                </div>

   
               <p class="quote">I think some people carry light differenly , in the way they have of making my world a little more beautiful simply by being here , you are one of those people . </p>
   
   
            </div>
            
   
   
        </div>
        
        
        <script src="script.js"></script>
            
    </body>
</html>
